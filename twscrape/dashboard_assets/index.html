<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="twscrape-token" content="__CSRF_TOKEN__" />
    <meta name="theme-color" content="#fafafa" />
    <title>twscrape · 账号</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <a class="skip-link" href="#accountsHeading">跳到账号列表</a>
    <main class="shell">
      <header class="topbar">
        <a class="wordmark" href="/accounts">twscrape</a>
        <nav class="app-nav" aria-label="主导航">
          <a class="nav-link" href="/accounts" aria-current="page">账号</a>
          <a class="nav-link" href="/console">API</a>
        </nav>
        <div class="session">
          <span class="session-user" id="sessionUser" hidden></span>
          <button type="button" class="ghost" id="logoutButton">退出</button>
        </div>
      </header>

      <header class="page-header">
        <div>
          <h1 id="accountsHeading">账号</h1>
          <p class="page-lead">查看账号状态与代理配置</p>
        </div>
        <button type="button" class="primary" id="addButton">添加账号</button>
      </header>

      <div class="summary-row">
        <ul class="pool-summary" id="poolSummary" aria-label="账号池计数">
          <li>可用 <strong id="statReady">—</strong></li>
          <li>
            <button type="button" class="summary-filter" id="viewAttention" aria-pressed="false">
              需处理 <strong id="statAttention">—</strong>
            </button>
          </li>
          <li>冷却 <strong id="statCooling">—</strong></li>
          <li>已停用 <strong id="statDisabled">—</strong></li>
        </ul>
      </div>
      <p class="page-error" id="loadError" hidden></p>

      <section class="workspace" aria-labelledby="accountsHeading">
        <div class="toolbar">
          <div class="toolbar-actions">
            <label class="search">
              <span class="visually-hidden">搜索用户名</span>
              <input
                id="searchInput"
                type="search"
                placeholder="搜索用户名"
                autocomplete="off"
                spellcheck="false"
                aria-label="搜索用户名"
              />
            </label>
            <label class="filter-label">
              <span class="visually-hidden">筛选状态</span>
              <select id="statusFilter" aria-label="筛选账号状态">
                <option value="all">全部状态</option>
                <option value="attention">需处理</option>
                <option value="cooling">冷却中</option>
                <option value="ready">可用</option>
                <option value="disabled">已停用</option>
              </select>
            </label>
            <button type="button" class="secondary" id="checkAllButton">检测全部</button>
          </div>
          <p class="sync" id="updatedAt" aria-live="polite">正在连接</p>
        </div>

        <div class="check-panel" id="checkPanel" hidden>
          <div class="check-head">
            <p class="check-status" id="checkStatus" aria-live="polite"></p>
            <button type="button" class="ghost" id="cancelCheckButton" hidden>取消检测</button>
          </div>
          <div class="check-track" role="presentation">
            <span class="check-fill" id="checkFill"></span>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>账号</th>
                <th>状态</th>
                <th>代理</th>
                <th class="cell-requests">总请求</th>
                <th>最后使用</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="accountRows"></tbody>
          </table>
          <div class="empty" id="emptyState" hidden>
            <strong id="emptyTitle">还没有账号</strong>
            <span id="emptyHint">添加 Cookie 后才会出现在列表中</span>
          </div>
        </div>
      </section>
    </main>

    <dialog id="addDialog" aria-labelledby="addDialogTitle">
      <form id="addForm" autocomplete="off">
        <div class="dialog-head">
          <div>
            <h2 id="addDialogTitle">添加账号</h2>
            <p>添加账号并导入 Cookie</p>
          </div>
          <button type="button" class="icon-button" id="closeDialog" aria-label="关闭">
            ×
          </button>
        </div>
        <label>
          账号名称
          <input
            id="cookieUsername"
            name="username"
            maxlength="80"
            placeholder="例如 xdevelopers"
            required
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <label>
          Cookie
          <textarea
            id="cookieValue"
            name="cookies"
            rows="6"
            placeholder="auth_token=…; ct0=…"
            required
            autocomplete="off"
            spellcheck="false"
          ></textarea>
        </label>
        <p class="form-error" id="formError" hidden></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancelDialog">取消</button>
          <button type="submit" class="primary" id="submitAccount">添加账号</button>
        </div>
      </form>
    </dialog>

    <dialog id="editDialog" aria-labelledby="editDialogTitle">
      <form id="editForm" autocomplete="off">
        <div class="dialog-head">
          <div>
            <h2 id="editDialogTitle">管理账号</h2>
            <p>更新会话、代理与启停状态</p>
          </div>
          <button type="button" class="icon-button" id="closeEditDialog" aria-label="关闭">
            ×
          </button>
        </div>
        <div class="readonly-field">
          <span class="field-label">账号名称</span>
          <span id="editUsernameDisplay" class="readonly-value"></span>
          <p class="field-hint">用户名不可更改</p>
        </div>
        <label class="check-row">
          <input id="editActive" name="active" type="checkbox" />
          启用账号（参与轮换）
        </label>
        <label>
          Cookie
          <textarea
            id="editCookies"
            name="cookies"
            class="compact-textarea"
            rows="4"
            placeholder="留空保持不变"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
        </label>
        <p class="field-hint">留空保留现有 Cookie</p>
        <fieldset class="proxy-fieldset">
          <legend>代理</legend>
          <p class="proxy-status" id="editProxyStatus">未配置</p>
          <p class="field-hint">显示地址，隐藏认证信息</p>
          <p class="field-hint" id="editProxySource" hidden></p>
          <div class="radio-stack">
            <label class="radio-row">
              <input
                id="editProxyKeep"
                type="radio"
                name="editProxyMode"
                value="keep"
                checked
              />
              保持不变
            </label>
            <label class="radio-row">
              <input id="editProxySet" type="radio" name="editProxyMode" value="set" />
              更新代理
            </label>
            <label class="radio-row">
              <input id="editProxyClear" type="radio" name="editProxyMode" value="clear" />
              清除代理
            </label>
          </div>
          <label id="editProxyLabel" hidden>
            新代理地址
            <input
              id="editProxy"
              name="proxy"
              maxlength="1000"
              placeholder="host:port 或 http://host:port"
              autocomplete="off"
              spellcheck="false"
              disabled
            />
          </label>
        </fieldset>
        <p class="form-error" id="editFormError" hidden></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancelEditDialog">取消</button>
          <button type="submit" class="primary" id="submitEdit">保存更改</button>
        </div>
        <div class="danger-zone">
          <p class="danger-kicker">危险操作</p>
          <p>从本机账号池永久删除该账号。删除前需要再次确认用户名。</p>
          <button type="button" class="danger" id="deleteAccountButton">删除账号</button>
        </div>
      </form>
    </dialog>

    <dialog id="deleteDialog" aria-labelledby="deleteDialogTitle" aria-describedby="deleteSummary">
      <form id="deleteForm" autocomplete="off">
        <div class="dialog-head">
          <div>
            <h2 id="deleteDialogTitle">确认删除账号</h2>
            <p id="deleteSummary"></p>
          </div>
          <button type="button" class="icon-button" id="closeDeleteDialog" aria-label="关闭">
            ×
          </button>
        </div>
        <label>
          输入用户名以确认（不含 @）
          <input
            id="deleteConfirmUsername"
            name="confirm_username"
            maxlength="80"
            required
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <p class="form-error" id="deleteFormError" hidden></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancelDeleteDialog">取消</button>
          <button type="submit" class="danger" id="submitDelete" disabled>确认删除</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/dashboard.js" defer></script>
  </body>
</html>
